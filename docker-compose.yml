services:
  db:
    image: pgvector/pgvector:pg16
    container_name: newsflip-db
    environment:
      POSTGRES_USER: newsflip
      POSTGRES_PASSWORD: newsflip
      POSTGRES_DB: newsflip
    ports:
      - "5432:5432"
    volumes:
      - newsflip_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U newsflip -d newsflip"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  newsflip_pgdata:
